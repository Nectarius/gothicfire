apiVersion: v1
kind: ConfigMap
metadata:
  name: gothicfire-env
  namespace: gothicfire
data:
  # Application runs HTTP internally; Traefik + cert-manager handle TLS externally
  APP_MODE: "DEV"
  MONGODB_DB: "gothicfire"

  # OAuth redirect URIs (routed through Traefik with TLS termination)
  GOOGLE_REDIRECT_URI: "https://kornelian.com/auth/google/callback?provider=google"
  TWITTER_CALLBACK_URL: "https://kornelian.com/auth/twitter/callback"

  # OAuth endpoints
  GOOGLE_AUTH_URI: "https://accounts.google.com/o/oauth2/auth"
  GOOGLE_TOKEN_URI: "https://oauth2.googleapis.com/token"
  TWITTER_AUTH_URI: "https://twitter.com/i/oauth2/authorize"
  TWITTER_TOKEN_URI: "https://api.twitter.com/2/oauth2/token"
