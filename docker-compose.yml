services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gothicfire:latest
    container_name: gothicfire-app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - APP_MODE=${APP_MODE:-DEV}
      - PORT=${PORT:-}
      - TLS_CERT_FILE=${TLS_CERT_FILE:-gothiccastles.com.pem}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-gothiccastles.com.key}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_DB=${MONGODB_DB:-gothicfire}
      # AI Agent configuration
      - AI_AGENT_URL=${AI_AGENT_DOCKER_URL:-http://agent:8000}
      - USE_AI_AGENT=${USE_AI_AGENT:-true}
      # OAuth configurations:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID:-}
      - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET:-}
    volumes:
      - ./gothiccastles.com.pem:/app/gothiccastles.com.pem:ro
      - ./gothiccastles.com.key:/app/gothiccastles.com.key:ro
      - ./cert.pem:/app/cert.pem:ro
      - ./key.pem:/app/key.pem:ro
    depends_on:
      mongo:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      - gothicfire-network

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: gothicfire-agent:latest
    container_name: gothicfire-agent
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODEL_PATH=${MODEL_PATH:-/app/models/qwen2.5-1.5b-instruct-q4_k_m.gguf}
      - AI_PORT=8000
      - AI_HOST=0.0.0.0
      - AI_THREADS=${AI_THREADS:-4}
      - AI_CTX=${AI_CTX:-1024}
      - AUTO_DOWNLOAD_MODEL=${AUTO_DOWNLOAD_MODEL:-true}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gothicfire-network

  mongo:
    image: mongo:7.0
    container_name: gothicfire-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gothicfire-network

volumes:
  mongo_data:
    driver: local

networks:
  gothicfire-network:
    driver: bridge
